<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensa</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    Click to place marker:
    <div>
      <canvas class="canvas">
      </canvas>
    </div>
    <div id="actions">
      <button id="download-btn">Download</button>
      <button id="share-btn">Share</button>
      <button id="clear-btn">Clear</button>
    </div>
    <footer>
      <a href="https://github.com/fietec/mensa" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        View Source Code
      </a>
    </footer>
    <script>

      const imageName = "mensa-position.png";
      let circle = null;

      function downloadImage() {
          if (!circle){
              alert("Please place a marker first!");
              return;
          }

          canvas.toBlob(function(blob) {
              if (!blob) {
                  console.error("Could not create image.");
                  return;
              }

              const link = document.createElement("a");
              link.download = imageName;
              link.href = URL.createObjectURL(blob);
              link.click();

              URL.revokeObjectURL(link.href);
          }, "image/png");
      }

      async function shareImage() {
          if (!circle){
              alert("Please place a marker first!");
              return;
          }

          canvas.toBlob(async function(blob) {
              if (!blob) {
                  console.error("Could not create image.");
                  return;
              }
              const file = new File([blob], imageName, {type: "image/png"});

              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                  try {
                      await navigator.share({
                          files: [file],
                          title: "Sitze hier"
                      });
                  } catch (error) {
                      if (error.name !== "AbortError") {
                          console.error(error);
                      }
                  }
              } else {
                  downloadImage();
              }
          }, "image/png");
      }

      function clear(){
          circle = null;
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          context.drawImage(image, 0, 0);
      }
      
      const canvas = document.querySelector("canvas");
      const context = canvas.getContext("2d");
      const downloadBtn = document.getElementById("download-btn");
      downloadBtn.onclick = downloadImage;
      const shareBtn = document.getElementById("share-btn");
      shareBtn.onclick = shareImage;
      const clearBtn = document.getElementById("clear-btn");
      clearBtn.onclick = clear;
      
      const image = new Image();
      image.src = 'blueprint.png';
      image.onload = clear;

      canvas.onclick = function(event){
          clear();
          const rect = canvas.getBoundingClientRect();
          const x = (event.clientX - rect.left) * (canvas.width / rect.width);
          const y = (event.clientY - rect.top) * (canvas.height / rect.height);

          circle = {x, y};
          context.beginPath();
          context.arc(circle.x, circle.y, 5, 0, 2*Math.PI);
          context.strokeStyle = "red";
          context.lineWidth = 2;
          context.stroke();
      };

    </script>
  </body>
</html>
